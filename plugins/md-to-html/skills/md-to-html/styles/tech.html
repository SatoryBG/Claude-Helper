<style>
/* "tech" style: configurations, commands, procedures, runbooks */
.page { max-width: 1240px; margin: 0 auto; padding: 2rem 16px 3rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
@media (min-width: 1100px) {
  .page { grid-template-columns: 250px minmax(0, 1fr); }
  .toc { position: sticky; top: 1.5rem; max-height: calc(100vh - 3rem); overflow-y: auto; }
}
.toc { font-size: 0.86rem; border-left: 2px solid var(--border); padding-left: 0.9rem; align-self: start; }
.toc li { margin: 0.2rem 0; }
.toc-title { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.75rem; color: var(--muted); }
main { max-width: 940px; }
.doc-header { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 2rem; }
.doc-kind { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); }
.doc-title { font-size: 1.85rem; margin-bottom: 0.3rem; }
h2 { font-size: 1.35rem; padding-left: 0.6rem; border-left: 4px solid var(--accent); }
h3 { font-family: var(--mono); font-size: 1.02rem; font-weight: 600; }
body { font-size: 15.5px; }
td code, th code { white-space: nowrap; }
.sourceCode, pre { position: relative; }
.copy-btn { position: absolute; top: 0.45rem; right: 0.45rem; font: 0.75rem var(--font); color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 0.15rem 0.55rem; cursor: pointer; opacity: 0.75; }
.copy-btn:hover { opacity: 1; color: var(--accent); }
</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const L = document.body.dataset;
  document.querySelectorAll("pre").forEach(pre => {
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.type = "button"; btn.textContent = L.lCopy || "Copy";
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(pre.querySelector("code")?.innerText ?? pre.innerText); btn.textContent = L.lCopied || "Copied"; }
      catch { btn.textContent = L.lCopyFailed || "Error"; }
      setTimeout(() => btn.textContent = L.lCopy || "Copy", 1500);
    });
    pre.appendChild(btn);
  });
});
</script>
